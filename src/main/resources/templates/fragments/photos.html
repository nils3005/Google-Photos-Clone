<div th:fragment="photos">
  <!--Fotos-->
  <div class="row mt-3 pt-3 mb-5 pb-5" id="photo-row">
    <div class="col-sm-4" th:each="foto : ${photos}">
      <div class="form-check mt-4 mb-4 d-flex justify-content-center shadow p-3 bg-white rounded">
        <img th:src="@{'data:image/jpeg;base64,' + ${foto.getBase64()}}" th:id="${foto.id}" class="photo img-fluid" alt="Foto" loading="lazy">
      </div>
    </div>
  </div>

  <!--Statusanzeige-->
  <div class="row text-center">
    <div class="col">
      <span th:text="${photos?.isEmpty} ? 'Hier ist der Platz für deine Fotos!' : ''" class="text-secondary"></span>
    </div>
  </div>
</div>
