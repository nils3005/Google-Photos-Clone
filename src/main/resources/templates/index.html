<!DOCTYPE html>
<html lang="de" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Google Photos Clone</title>
    <!--link-Tag zu Css fehlt-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div id="navbar">
    <ul id="nav">
        <li class="navLeft">Google Photos Clone</li>
        <li class="navRight"><input id="fileupload" type="file" name="fileupload" /></li>
        <li class="navRight"><button id="upload-button" onclick="uploadFile()">Hochladen</button></li>
    </ul>
</div>

<h2>Hier ist Platz für deine Fotos</h2>

<div id="photos">
    <table>
        <tr th:each="foto : ${photos}">
            <td><img alt="Foto" th:src="@{'data:image/png;base64,'+${foto.getBase64()}}" style="max-width: 300px"></td>
        </tr>
    </table>
</div>

<div id="footer">
    <a href="https://github.com/nils3005">https://github.com/nils3005</a>
</div>

<script>
     async function uploadFile() {
            let formData = new FormData();
            formData.append("data", fileupload.files[0]);
            await fetch('http://localhost:8080', {
                method: "POST",
                body: formData
        })
     }
</script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
<style>
    html {
    scroll-behavior: smooth;
}

body {
    font-family: monospace, sans-serif;
    font-size: 2em;
    max-width: 70ch;
    display: inline;
    padding-top: 0;
    margin-top: 0;
    max-width: 100%;
}

#nav {
    list-style-type: none;
    display: inline;
    font-size: 2em;
}

#navbar {
    padding-bottom: 100px;
    position: sticky;
    border-bottom: solid black 10px;
}

.navLeft {
    float: left;
}

.navRight {
    float: right;
    font-size: 0.5em;
}

#footer {
    border-top: solid black 10px;
    text-align: center;
    padding: 100px 0px 100px 0px;
}
</style>
</body>
</html>
