<!DOCTYPE html>
<html lang="de" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fotogalerie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <div class="row fixed-top pt-2 pb-2 mb-5 shadow p-3 bg-white rounded">
            <div class="col">
                <span class="h1">Meine Fotogalerie</span>
            </div>

            <div class="col">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <button onclick="uploadFile();" type="button" class="btn input-group-text" id="inputGroupFileAddon01">Hochladen</button>
                    </div>
                    <div class="custom-file">
                        <input type="file" class="custom-file-input" id="fileupload" name="fileupload" aria-describedby="inputGroupFileAddon01">
                        <label class="custom-file-label" for="fileupload">Datei auswählen</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5 pt-5 text-center">
            <div class="col">
            <span th:text="${photos?.isEmpty} ? 'Hier ist der Platz für deine Fotos!' : ''" class="text-secondary"></span>
            </div>
        </div>

        <div class="row mt-5 pt-3 mb-5 pb-5">
            <div class="col-sm-6" th:each="foto : ${photos}">
                <div class="form-check mt-4 mb-4 d-flex justify-content-center shadow p-3 bg-white rounded">
                    <img th:src="@{'data:image/png;base64,'+${foto.getBase64()}}" class="photo img-fluid" alt="Foto" loading="lazy">
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="photo-modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body d-flex justify-content-center">
                        <img class="modal-img img-fluid" src="" alt="Photo Modal">
                    </div>
                    <div class="modal-footer">
                        <!--Möglichkeit Bilder zu löschen-->
                        <button type="button" onclick="deleteFile()" class="btn" data-dismiss="modal"><span class="bi bi-trash"></span></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5 pb-2 pt-2 bg-secondary text-center text-light shadow-lg rounded fixed-bottom">
            <div class="col">
                <span class="h6">Made by <a class="text-light" href="https://github.com/nils3005">nils3005</a></span>
            </div>
        </div>
    </div>

</body>
    <script>
        async function uploadFile() {
            let formData = new FormData();
            formData.append("data", fileupload.files[0]);
            await fetch('http://localhost:8080', {
               method: "POST",
               body: formData
            })
            location.reload();
        }

        async function deleteFile() {
            location.reload();
        }

        document.addEventListener("click", function (e){
            if(e.target.classList.contains("photo")){
                const src = e.target.getAttribute("src");
                document.querySelector(".modal-img").src = src;
                const myModal = new bootstrap.Modal(document.getElementById('photo-modal'))
                myModal.show();
            }
        })
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

    <style>
        @media (min-width: 768px) {
          .modal-xl {
            width: 90%;
           max-width:1400px;
          }
        }
    </style>
</html>
